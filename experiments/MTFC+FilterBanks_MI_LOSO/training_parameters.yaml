baseline: null
description: MTFC + FilterBanks (TemporalCollapse_ChannelsExpand_FilterBanks) + LOSO
  (No STFT reconstruction, f_t_s branch method)base performance on MI datasets, frequency
  spectrum reconstruction included
name: MTFC+FilterBanks_MI_LOSO
parameters:
  Dataset-Details:
    BNCI2014_001:
      fs: 250.0
      n_ch: 22
      n_classes: 2
      n_times: 750
      n_trials: 144
    BNCI2014_002:
      fs: 512.0
      n_ch: 15
      n_classes: 2
      n_times: 1536
      n_trials: 160
    BNCI2014_004:
      fs: 250.0
      n_ch: 3
      n_classes: 2
      n_times: 750
      n_trials: 120
  Model-Hyperparameters:
    channel_depth: 1
    filter_banks: 11
    freq_downsample: 1
    patch_embedding_size: 40
    patch_size: 100
    spatial_dimensionality: 16
    sst_embedding_size: 40
    sst_method: filter_banks
    temporal_depth: 1
    wsize_divisor: 2
  Training-Hyperparameters:
    batch_size: 64
    eval_inter: 5
    k-folds: 5
    k-folds-repeat: 1
    learning_rate: 0.001
    n_iter: 100
    validation_size: 0.0
