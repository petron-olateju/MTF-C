baseline: null
description: MTFC + FilterBanks (MultiTemporalCollapse_ChannelsProject_FilterBank)
  + LOSO (No STFT reconstruction, f_t_s branch method)base performance on MI datasets,
  frequency spectrum reconstruction included
name: MTFC+FilterBanks_REST_LOSO
parameters:
  Dataset-Details:
    Cattan2019_PHMD:
      class_names:
      - 'off'
      - 'on'
      fs: 512.0
      n_ch: 16
      n_classes: 2
      n_times: 5120
      n_trials: 10
    Rodrigues2017:
      class_names:
      - closed
      - open
      fs: 512.0
      n_ch: 16
      n_classes: 2
      n_times: 5120
      n_trials: 8
  Model-Hyperparameters:
    channel_depth: 1
    filter_banks: 11
    freq_downsample: 1
    patch_embedding_size: 40
    patch_size: 100
    spatial_dimensionality: 16
    sst_embedding_size: 40
    sst_method: filter_banks
    temporal_depth: 1
    wsize_divisor: 2
  Training-Hyperparameters:
    batch_size: 64
    eval_inter: 5
    k-folds: 5
    k-folds-repeat: 1
    learning_rate: 0.001
    n_iter: 100
    validation_size: 0.0
