    channel_depth: 1
    embedding_size: 40
    patch_size: 100
    spatial_dimensionality: 16
    temporal_depth: 1
  Training-Hyperparameters:
    batch_size: 64
    eval_inter: 5
    k-folds: 5
    k-folds-repeat: 1
    learning_rate: 0.001
    n_iter: 100
    validation_size: 0.0
