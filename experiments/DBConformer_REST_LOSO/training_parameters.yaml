baseline: null
description: DBConformer LOSO benchmark on REST datasets
name: DBConformer_REST_LOSO
parameters:
  Dataset-Details:
    Cattan2019_PHMD:
      class_names:
      - 'off'
      - 'on'
      fs: 512.0
      n_ch: 16
      n_classes: 2
      n_times: 5120
      n_trials: 10
    Rodrigues2017:
      class_names:
      - closed
      - open
      fs: 512.0
      n_ch: 16
      n_classes: 2
      n_times: 5120
      n_trials: 8
