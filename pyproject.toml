[project]
name = "mtf-c"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "mne>=1.11.0",
    "pytest>=9.0.2",
    "einops>=0.8.2",
    "timm>=1.0.25",
    "scikit-learn>=1.8.0",
    "moabb>=1.5.0",
    "typing-extensions>=4.15.0",
    "typing>=3.10.0.0",
    "braindecode>=1.0.0",
    "kaggle>=2.0.0",
    "pytorch-lightning>=2.6.5",
    "torchmetrics>=1.9.0",
    "black>=26.5.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
