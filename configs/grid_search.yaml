training:
  val_size: 0.0
  n_iter: 100
  eval_inter: 5
  folds: 5
  n_repeats: 5
  lr: 1.0e-3
  batch_size: 32

db_conformer:
  patch_size: [20, 40, 60, 80, 100, 120, 140]
  filter_banks: [7, 9, 11, 13, 15]
  wsize_divisor: [2, 4]
  spa_dim: [16]
  gate_flag: [False]
  posemb_flag: [True]
  branch: ['all']
  chn_attn_flag: [True]
  fts_attn_flag: [False]
  sst_method: [False]
  stft_reconstruction: [False]
  emb_size: [40]
  tem_depth: [1]
  chn_depth: [1]

mtf_c:
  patch_size: [150]
  filter_banks: [151]
  freq_downsample: [15]
  wsize_divisor: [2]
  sst_method: ['st_addition_projection']
  stft_reconstruction: [False] #[True, False]
  ct_shared_projection: [False] #[True, False]  # Use shared projection in spectrogram estimator (filter_banks only)
  sst_shared_projection: [False] #[True, False]  # Project embeddings to SST dimension
  patch_emb_size: [20]
  n_heads_patch: [5]
  sst_emb_size: [40]
  branch: ['all'] #['all', 'ft_s', 'fs_t', 'f_t_s', 'f_ts']
  chn_attn_flag: [False]
  fts_attn_flag: [True]
  tem_depth: [1]
  chn_depth: [1]
  spa_dim: [16]
  gate_flag: [False]
  posemb_flag: [True]
